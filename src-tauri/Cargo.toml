[package]
name = "wordrop"
version = "0.3.2"
description = "A local-first desktop wardrobe manager"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wordrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "system-proxy"] }
scraper = "0.27"
tokio = { version = "1", features = ["net", "time", "sync"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
