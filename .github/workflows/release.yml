name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release tag and project versions
        run: npm run version:check -- "${{ github.ref_name }}"

      - name: Run frontend quality checks
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test

      - name: Run native tests
        run: npm run test:native

      - name: Build installer and publish GitHub Release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: WorDrop ${{ github.ref_name }}
          releaseBody: |
            Download the `WorDrop_*_x64-setup.exe` file below to install WorDrop on Windows 10 or 11.

            Windows may show an unrecognized publisher warning because this release is intentionally unsigned.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          assetNamePattern: "[name]_[version]_[arch][setup].[ext]"

      - name: Retain installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorDrop-${{ github.ref_name }}-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
